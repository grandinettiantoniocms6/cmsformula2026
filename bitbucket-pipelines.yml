          name: Deploy PROD
          script:
            - echo "Deploy PROD"
            - curl -s "https://ploi.io/webhooks/servers/87653/sites/277546/deploy?token=wKyxh2b5CuWpcEcGeahGkmGpfQP9KXiR769rDipSS9JMY50wik&direct=true"